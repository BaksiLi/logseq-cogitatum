name: Logseq integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check and build
        if: matrix.node == 22
        run: npm run check && npm test && npm run build -- --production
      - name: Install Chromium
        if: matrix.node == 24
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Verify and package release
        if: matrix.node == 24
        run: npm run package
      - uses: actions/upload-artifact@v7
        if: matrix.node == 24
        with:
          name: logseq-cogitatum-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
